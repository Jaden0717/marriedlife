<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Memory Lane ✨</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #fef9f0 0%, #fff4e6 100%);
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
      color: #2e241f;
    }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.5rem;
      color: #c45c4a;
    }

    .sub {
      margin-top: 0.5rem;
      color: #b8725a;
    }

    #message {
      background: white;
      padding: 1rem;
      border-radius: 20px;
      margin: 2rem 0;
      text-align: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .upload-card {
      background: white;
      padding: 1.5rem;
      border-radius: 24px;
      margin-bottom: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .upload-area {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: center;
    }

    .file-label {
      background: #ffe7db;
      padding: 0.8rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: bold;
      color: #b45a3e;
    }

    input[type="file"] {
      display: none;
    }

    .caption-input input {
      padding: 0.8rem 1rem;
      border-radius: 999px;
      border: 1px solid #ddd;
      width: 250px;
    }

    .btn-upload {
      background: #e27c5c;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: bold;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .memory-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    }

    .card-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card-info {
      padding: 1rem;
    }

    .card-caption {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .timestamp {
      font-size: 0.8rem;
      color: #999;
    }

    .empty-message {
      text-align: center;
      padding: 2rem;
      color: #b48468;
    }

    .footer-note {
      text-align: center;
      margin-top: 3rem;
      color: #cbae99;
    }
  </style>
</head>

<body>

  <div class="app-container">

    <div class="header">
      <h1>📸 Jaden's and Vitoria's Memory Book</h1>
      <div class="sub">created on 5/26/2026</div>
    </div>

    <div id="message">Loading Firebase Message...</div>

    <div class="upload-card">
      <div class="upload-area">

        <label class="file-label">
          📷 Choose Photo
          <input type="file" id="imageUploadInput" accept="image/*">
        </label>

        <div class="caption-input">
          <input type="text" id="photoCaption" placeholder="write a little memory..." />
        </div>

        <button class="btn-upload" id="uploadBtn">
          💾 Save Memory
        </button>

      </div>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <div class="empty-message">
        ✨ No memories yet ✨
      </div>
    </div>

    <div class="footer-note">
      💖 I love you so very much baby
    </div>

  </div>

  <script type="module" src="app.js"></script>

  <script>
    let memoriesArray = [];

    const fileInput = document.getElementById('imageUploadInput');
    const captionInput = document.getElementById('photoCaption');
    const uploadBtn = document.getElementById('uploadBtn');
    const galleryGrid = document.getElementById('galleryGrid');

    function loadMemories() {
      const stored = localStorage.getItem('our_love_gallery');

      if (stored) {
        memoriesArray = JSON.parse(stored);
      }

      renderGallery();
    }

    function saveMemories() {
      localStorage.setItem('our_love_gallery', JSON.stringify(memoriesArray));
    }

    function renderGallery() {

      if (memoriesArray.length === 0) {
        galleryGrid.innerHTML = `
          <div class="empty-message">
            ✨ No memories yet ✨
          </div>
        `;
        return;
      }

      galleryGrid.innerHTML = "";

      memoriesArray.forEach(memory => {

        const card = document.createElement('div');
        card.className = 'memory-card';

        card.innerHTML = `
          <img class="card-img" src="${memory.image}" />
          <div class="card-info">
            <div class="card-caption">${memory.caption}</div>
            <div class="timestamp">${new Date(memory.time).toLocaleString()}</div>
          </div>
        `;

        galleryGrid.appendChild(card);

      });
    }

    uploadBtn.addEventListener('click', () => {

      const file = fileInput.files[0];

      if (!file) {
        alert("Choose a photo first");
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {

        memoriesArray.unshift({
          image: e.target.result,
          caption: captionInput.value || "💕 Memory",
          time: Date.now()
        });

        saveMemories();
        renderGallery();

        captionInput.value = "";
        fileInput.value = "";

      };

      reader.readAsDataURL(file);

    });

    loadMemories();
  </script>

</body>
</html>
